plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.minis.imt'
    compileSdk 35

    defaultConfig {
        applicationId "com.minis.imt"
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName "1.0"
    }

    // لا نستخدم أندرويد-إكس إطلاقاً: صفر اعتماديات = بناء أسرع وأكثر موثوقية
    buildTypes {
        debug {
            minifyEnabled false
        }
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
    buildFeatures {
        buildConfig = false
    }
    packaging {
        resources.excludes += ['META-INF/*']
    }
}

dependencies {
    // لا شيء — كل شي مبني على واجهات أندرويد الأصلية + HttpURLConnection
}
